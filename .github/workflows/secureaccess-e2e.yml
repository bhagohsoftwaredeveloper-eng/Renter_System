name: SecureAccess E2E

on:
  push:
    branches: [main]
    paths:
      - 'SecureAccess/**'
      - '.github/workflows/secureaccess-e2e.yml'
  pull_request:
    paths:
      - 'SecureAccess/**'
      - '.github/workflows/secureaccess-e2e.yml'

jobs:
  e2e:
    name: Playwright (web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SecureAccess

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SecureAccess/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build web bundle
        run: npm run build:web

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: SecureAccess/playwright-report/
          retention-days: 7
