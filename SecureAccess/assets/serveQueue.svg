<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- userSpaceOnUse so the notch cut-outs sample the exact same gradient as
         the background and blend in seamlessly. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.55" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticket" x1="212" y1="332" x2="812" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f1"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#sheen)"/>

  <!-- Soft shadow under the ticket -->
  <rect x="212" y="346" width="600" height="360" rx="44" fill="#053b37" opacity="0.18"/>

  <!-- Meal ticket -->
  <g>
    <rect x="212" y="332" width="600" height="360" rx="44" fill="url(#ticket)"/>
    <!-- side notches: filled with the page gradient to look punched out -->
    <circle cx="212" cy="512" r="44" fill="url(#bg)"/>
    <circle cx="812" cy="512" r="44" fill="url(#bg)"/>
    <!-- perforation / tear line -->
    <line x1="646" y1="372" x2="646" y2="652" stroke="#0F766E" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="4 30" opacity="0.55"/>

    <!-- Fork -->
    <g fill="#0F766E">
      <rect x="372" y="408" width="13" height="70" rx="6"/>
      <rect x="398" y="408" width="13" height="70" rx="6"/>
      <rect x="424" y="408" width="13" height="70" rx="6"/>
      <rect x="372" y="470" width="65" height="26" rx="13"/>
      <rect x="396" y="470" width="17" height="160" rx="8"/>
    </g>
    <!-- Knife -->
    <g fill="#0F766E">
      <path d="M498 408
               c34 6 40 70 30 120
               c-3 16 -16 16 -19 2
               c-6 -28 -9 -84 -11 -118
               c-0.4 -7 4 -5 0 -4 z"/>
      <rect x="503" y="500" width="16" height="130" rx="8"/>
    </g>
  </g>

  <!-- Verified badge -->
  <g>
    <circle cx="762" cy="360" r="98" fill="#10B981" stroke="#ffffff" stroke-width="16"/>
    <path d="M718 360 l30 30 l58 -62" fill="none" stroke="#ffffff"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
